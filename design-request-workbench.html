<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計師工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F1F3; --card:#FFFFFF;
    --shadow:0 1px 2px rgba(20,20,30,.05), 0 6px 16px rgba(20,20,30,.04);
    --ink:#17181C; --ink-soft:#8A8A93; --ink-faint:#C2C2C8; --line:#ECECEE;
    --accent:#3E7BFA;
    --input-bg:#FAFAFB; --hover-bg:#F1F1F3;
    --btn-primary:#17181C; --btn-primary-text:#FFFFFF;
  }
  html[data-theme="dark"]{
    --bg:#17181C; --card:#212227;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.25);
    --ink:#EDEDEF; --ink-soft:#9A9AA3; --ink-faint:#5E5F66; --line:#33343A;
    --accent:#5B8DEF;
    --input-bg:#26272D; --hover-bg:#2B2C33;
    --btn-primary:#5B8DEF; --btn-primary-text:#FFFFFF;
  }
  html[data-theme="dark"] body{background:var(--bg);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',ui-sans-serif,sans-serif;
    padding:32px 20px 400px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ---- 密碼閘 ---- */
  .gate-wrap{
    max-width:380px;margin:14vh auto 0;background:var(--card);border-radius:20px;
    box-shadow:var(--shadow);padding:32px 28px;text-align:center;
  }
  .gate-wrap h1{font-size:19px;font-weight:800;margin:0 0 6px;}
  .gate-wrap p{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;}
  .gate-wrap input{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-family:inherit;font-size:15px;text-align:center;letter-spacing:.1em;background:var(--input-bg);
    color:var(--ink);margin-bottom:12px;
  }
  .gate-wrap input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .gate-wrap button{
    width:100%;border:none;background:var(--btn-primary);color:var(--btn-primary-text);font:inherit;font-weight:700;font-size:14px;
    padding:12px;border-radius:12px;cursor:pointer;
  }
  .gate-wrap button:hover{opacity:.88;}
  .gate-error{color:#B3324A;font-size:12px;margin-top:10px;display:none;}
  .gate-error.show{display:block;}

  /* ---- 主畫面 ---- */
  #mainView{display:none;}
  #mainView.show{display:block;}

  .top-links{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);
    text-decoration:none;font-weight:600;cursor:pointer;
  }
  .back-link:hover{color:var(--ink);}
  .refresh-link{
    border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;
    font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .refresh-link:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

  .save-all-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;
    font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .save-all-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .save-all-btn:disabled{opacity:.6;cursor:not-allowed;}
  .save-all-msg{font-size:11.5px;align-self:center;}
  .theme-toggle-btn{
    display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;
    border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;
    transition:background-color .2s ease, border-color .2s ease;
  }
  .theme-toggle-btn:hover{background:var(--hover-bg);}
  .save-all-msg.success{color:#1F8A4C;}
  .save-all-msg.error{color:#B3324A;}

  header{margin-bottom:20px;}
  .filter-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-field{display:flex;flex-direction:column;gap:6px;width:200px;}
  .filter-field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .filter-field.search-field{flex:1;min-width:220px;width:auto;}
  .filter-field.search-field input{
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:inherit;font-size:13px;color:var(--ink);background:var(--input-bg);box-sizing:border-box;
  }
  .filter-field.search-field input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 4px;text-transform:uppercase;}
  h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .subtitle{font-size:13px;color:var(--ink-soft);}

  .state-msg{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 20px;}

  .case-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px;}
  .case-card.urgent{box-shadow:0 0 0 1.5px #F3C5C0, 0 6px 16px rgba(20,20,30,.04);}
  .case-card.deep-link-highlight{animation:deepLinkPulse 2.6s ease;}
  @keyframes deepLinkPulse{
    0%{box-shadow:0 0 0 3px var(--accent), 0 6px 16px rgba(20,20,30,.04);}
    70%{box-shadow:0 0 0 3px var(--accent), 0 6px 16px rgba(20,20,30,.04);}
    100%{box-shadow:var(--shadow);}
  }

  .status-group{margin-bottom:0;}
  .status-group-list{
    max-height:0;opacity:0;overflow:hidden;pointer-events:none;
    transform:translateY(-8px);
    transition:max-height .38s ease, opacity .3s ease, transform .3s ease;
  }
  .status-group.expanded .status-group-list{
    max-height:8000px;opacity:1;transform:translateY(0);pointer-events:auto;
  }
  .status-group-collapse{
    display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--ink-soft);
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0 4px 10px;
    max-height:0;opacity:0;overflow:hidden;pointer-events:none;
    transition:max-height .3s ease, opacity .25s ease;
  }
  .status-group.expanded .status-group-collapse{
    max-height:40px;opacity:1;pointer-events:auto;
  }
  .status-group-collapse:hover{color:var(--ink);}
  .status-group-collapse-dot{width:8px;height:8px;border-radius:50%;flex:none;}

  .stack-card{
    position:relative;height:64px;margin-bottom:14px;cursor:pointer;
    max-height:80px;opacity:1;transform:translateY(0);overflow:visible;pointer-events:auto;
    transition:opacity .25s ease, transform .25s ease, max-height .3s ease, margin-bottom .3s ease;
  }
  .status-group.expanded .stack-card{
    max-height:0;opacity:0;transform:translateY(-8px);margin-bottom:0;overflow:hidden;pointer-events:none;
  }
  .stack-front{
    position:relative;z-index:2;height:64px;border-radius:16px;box-shadow:var(--shadow);
    padding:0 20px;display:flex;align-items:center;justify-content:space-between;
    transition:transform .15s ease;
  }
  .stack-card:hover .stack-front{transform:translateY(-2px);}
  .stack-front-left{display:flex;align-items:baseline;gap:10px;}
  .stack-status-label{font-size:15px;font-weight:800;}
  .stack-count{font-size:12.5px;font-weight:700;opacity:.8;}
  .stack-chevron{display:flex;}
  .case-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .case-name{font-size:16px;font-weight:800;}
  .case-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .case-tag{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--hover-bg);padding:3px 9px;border-radius:7px;}
  .urgent-badge{
    display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#C4372B;
    background:#FFF0EE;padding:5px 10px;border-radius:999px;white-space:nowrap;
  }
  .new-supplement-badge{
    display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#2F5FD6;
    background:#EAF1FF;padding:5px 10px;border-radius:999px;white-space:nowrap;
  }
  .supplement-block{background:#EAF1FF;}
  .badge-group{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;}
  .case-top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .score-stars{display:flex;gap:2px;}
  .score-stars svg{display:block;}
  .reply-btn{
    display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:11.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .reply-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .reply-btn.has-reply{border-color:#C7DBFF;background:#EAF1FF;color:#2F5FD6;}
  .reply-btn.has-reply:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .rating-reason-block{background:#FFF3E0;}
  .reply-shown-block{background:#EAF1FF;}

  .case-detail{font-size:12.5px;color:var(--ink-soft);margin-top:12px;line-height:1.8;}
  .case-toggle-btn{
    display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
    margin-top:12px;padding:8px;border:none;border-top:1px solid var(--line);background:none;
    font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .case-toggle-btn:hover{color:var(--ink);}
  .case-toggle-chevron{display:flex;transition:transform .2s ease;}
  .case-toggle-chevron.open{transform:rotate(180deg);}
  .case-body{
    overflow:hidden;max-height:0;opacity:0;transform:translateY(-8px);
    transition:max-height .4s ease, opacity .3s ease, transform .3s ease;
  }
  .case-body.open{max-height:4000px;opacity:1;transform:translateY(0);overflow:visible;}
  .case-detail b{color:var(--ink);font-weight:700;}
  .case-detail .row{margin-bottom:2px;}
  .detail-block{
    margin-top:10px;background:var(--input-bg);border-radius:12px;padding:12px 14px;font-size:12.5px;
    color:var(--ink);line-height:1.7;
  }
  .detail-block .label{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:2px;}

  .edit-row{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .history-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .history-label{font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:8px;}
  .history-list{
    font-size:12.5px;color:var(--ink);line-height:1.8;white-space:pre-line;
    margin-bottom:10px;
  }
  .history-empty{color:var(--ink-faint);}
  .history-add-row{display:flex;gap:8px;}
  .history-add-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:inherit;font-size:13px;color:var(--ink);background:var(--input-bg);
  }
  .history-add-row input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .history-add-row button{
    border:1px solid var(--btn-primary);background:var(--btn-primary);color:var(--btn-primary-text);font:inherit;font-weight:700;font-size:13px;
    padding:9px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .history-add-row button:hover{background:var(--accent);border-color:var(--accent);}
  .history-msg{font-size:11.5px;margin-top:6px;display:block;}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;}
  @media (max-width:520px){ .edit-grid{grid-template-columns:1fr;} }
  .edit-field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .edit-field select, .edit-field input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:inherit;font-size:13px;color:var(--ink);background:var(--input-bg);
  }
  .edit-field select:focus, .edit-field input:focus{outline:none;border-color:var(--accent);background:var(--card);}

  .csel{position:relative;}
  .csel-trigger{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:inherit;font-size:13px;color:var(--ink);background:var(--input-bg);cursor:pointer;text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .csel-trigger:hover{background:#F5F5F6;}
  .csel.open .csel-trigger{border-color:var(--accent);background:var(--card);}
  .csel-arrow{font-size:10px;color:var(--ink-soft);transition:transform .15s ease;margin-left:8px;flex:none;}
  .csel.open .csel-arrow{transform:rotate(180deg);}
  .csel-panel{
    display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
    background:var(--card);border-radius:14px;box-shadow:0 14px 32px rgba(20,20,30,.16);
    padding:6px;max-height:220px;overflow-y:auto;
  }
  .csel-panel.show{display:block;}
  .csel-item{padding:9px 12px;border-radius:9px;font-size:13px;color:var(--ink);cursor:pointer;}
  .csel-item + .csel-item{margin-top:3px;}
  .csel-item:hover{background:var(--hover-bg);}
  .csel-item.selected{background:var(--hover-bg);font-weight:700;}

  .save-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .save-btn{
    border:none;background:var(--btn-primary);color:var(--btn-primary-text);font:inherit;font-weight:700;font-size:13px;
    padding:9px 18px;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;
    transition:background-color .35s ease, opacity .35s ease;
  }
  .save-btn:hover{opacity:.88;}
  .save-btn:disabled{cursor:not-allowed;}
  .save-btn:disabled:not(.success-state){opacity:.6;}
  .submit-success-check{
    position:absolute;inset:0;background:var(--accent);border-radius:inherit;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .35s ease;
  }
  .save-btn.success-state .submit-success-check{opacity:1;}
  .submit-success-check .check-mark{
    stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .35s ease .15s;
  }
  .save-btn.success-state .submit-success-check .check-mark{stroke-dashoffset:0;}
  .save-msg{font-size:11.5px;}
  .save-msg.error{color:#B3324A;}
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,20,30,.5);z-index:300;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--card);border-radius:20px;box-shadow:0 20px 50px rgba(20,20,30,.3);
    padding:26px 26px 22px;max-width:400px;width:100%;max-height:86vh;overflow-y:auto;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-title{font-size:16px;font-weight:800;}
  .modal-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .modal-close{border:none;background:none;font-size:18px;color:var(--ink-faint);cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--ink);}
  .modal-submit{
    width:100%;margin-top:14px;border:none;background:var(--btn-primary);color:var(--btn-primary-text);font:inherit;font-weight:700;
    font-size:14px;padding:12px;border-radius:12px;cursor:pointer;
  }
  .modal-submit:hover{opacity:.88;}
  .modal-msg{font-size:12px;margin-top:10px;text-align:center;}
  .modal-msg.error{color:#B3324A;}
  .modal-msg.success{color:#1F8A4C;}

  .field-simple label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .field-simple input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--input-bg);
  }
  .field-simple input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .field-simple textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--input-bg);resize:vertical;
    box-sizing:border-box;
  }
  .field-simple textarea:focus{outline:none;border-color:var(--accent);background:var(--card);}

  .lock-cal-wrap{width:100%;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-header button{
    border:none;background:var(--hover-bg);color:var(--ink);width:28px;height:28px;border-radius:8px;
    cursor:pointer;font-size:15px;font-weight:700;
  }
  .cal-header button:hover{background:#E7E7EA;}
  #lockCalMonthLabel{font-size:13.5px;font-weight:800;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-day{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;border-radius:8px;cursor:pointer;color:var(--ink);position:relative;
  }
  .cal-day:hover{background:var(--hover-bg);}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day.locked{background:#FBEBEA;color:#B3324A;text-decoration:line-through;}
  .cal-day.locked:hover{background:#F6D9D6;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .cal-day .case-count{font-size:9px;color:var(--ink-faint);margin-top:1px;}
  .cal-day.locked .case-count{color:#C4726A;}
  .lock-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--ink-soft);}
  .lock-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;}
  .lock-dot.locked{background:#FBEBEA;box-shadow:inset 0 0 0 1px #B3324A;}
  .lock-dot.has-case{background:#EAF1FF;box-shadow:inset 0 0 0 1px var(--accent);}
</style>
<script>
  // 儘早套用主題，避免畫面先閃一下亮色再切換成暗色
  try{
    if(localStorage.getItem('workbenchTheme') === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  }catch(e){}
</script>
</head>
<body>

<div class="gate-wrap" id="gateWrap">
  <h1>設計師工作台</h1>
  <p>請輸入密碼進入</p>
  <input type="password" id="gatePassword" placeholder="密碼" onkeydown="if(event.key==='Enter') checkPassword()">
  <button onclick="checkPassword()">進入</button>
  <div class="gate-error" id="gateError">密碼不正確，請再試一次。</div>
</div>

<div class="wrap" id="mainView">

  <div class="top-links">
    <a class="back-link" onclick="history.back()">← 返回設計案統計</a>
    <div style="display:flex;gap:10px;">
      <button class="refresh-link" onclick="openLockModal()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px;">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>設計師班表
      </button>
      <button class="refresh-link" onclick="loadCases()">重新整理</button>
      <button class="save-all-btn" id="saveAllBtn" onclick="saveAllCases()">一鍵儲存</button>
      <span class="save-all-msg" id="saveAllMsg"></span>
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
        <svg id="themeIconSun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
          <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>

// ---- 自訂下拉選單元件（放最前面，確保其他程式碼執行時已經可用）----
const cselState = {};

function cselSetOptions(id, options, placeholder){
  if(!cselState[id]) cselState[id] = {};
  cselState[id].options = options; // [{value,label}]
  if(placeholder) cselState[id].placeholder = placeholder;
  renderCselPanel(id);
}

function renderCselPanel(id){
  const st = cselState[id];
  const panel = document.getElementById('csel_' + id + '_panel');
  if(!panel || !st.options) return;
  panel.innerHTML = st.options.map(function(opt){
    const selected = opt.value === st.value;
    const safeVal = opt.value.replace(/'/g, "\\'");
    return '<div class="csel-item' + (selected ? ' selected' : '') + '" onclick="cselChoose(\'' + id + '\',\'' + safeVal + '\')">' + opt.label + '</div>';
  }).join('');
}

function cselChoose(id, val){
  const st = cselState[id];
  const oldValue = st.value;
  const opt = st.options.filter(function(o){ return o.value === val; })[0];
  st.value = val;
  document.getElementById(id).value = val;
  const textEl = document.getElementById('csel_' + id + '_text');
  if(textEl) textEl.textContent = opt ? opt.label : val;
  closeAllCsel();
  renderCselPanel(id);
  if(st.onChange) st.onChange(val, oldValue);
}

// 不觸發 onChange，單純把選單顯示的值改回去（取消操作時用）
function cselSetValueSilent(id, val){
  const st = cselState[id];
  if(!st) return;
  const opt = st.options.filter(function(o){ return o.value === val; })[0];
  st.value = val;
  const hiddenEl = document.getElementById(id);
  if(hiddenEl) hiddenEl.value = val;
  const textEl = document.getElementById('csel_' + id + '_text');
  if(textEl) textEl.textContent = opt ? opt.label : val;
  renderCselPanel(id);
}

function toggleCsel(id){
  const panel = document.getElementById('csel_' + id + '_panel');
  const wasOpen = panel.classList.contains('show');
  closeAllCsel();
  if(!wasOpen){
    panel.classList.add('show');
    document.getElementById('csel_' + id).classList.add('open');
  }
}

function closeAllCsel(){
  document.querySelectorAll('.csel-panel.show').forEach(function(p){ p.classList.remove('show'); });
  document.querySelectorAll('.csel.open').forEach(function(c){ c.classList.remove('open'); });
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.csel')) closeAllCsel();
});

function initCsel(id, options, value, onChange){
  const opt = options.filter(function(o){ return o.value === value; })[0];
  cselState[id] = { options: options, value: value, placeholder: options[0] ? options[0].label : '', onChange: onChange };
  const textEl = document.getElementById('csel_' + id + '_text');
  if(textEl) textEl.textContent = opt ? opt.label : (options[0] ? options[0].label : '');
  renderCselPanel(id);
}

function formatDateStr(val){
  if(!val) return '';
  // 已經是 yyyy-MM-dd 格式就直接回傳
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(val).trim())) return String(val).trim();
  // 嘗試解析成 Date 物件再格式化
  const d = new Date(val);
  if(isNaN(d.getTime())) return String(val);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function parseDate(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return null;
  return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10)).getTime();
}

function applyFilterAndRender(){
  const list = document.getElementById('caseList');
  const allCases = window.__allCases || [];
  const sortMode = document.getElementById('sortFilter').value;
  const statusFilter = document.getElementById('statusFilter').value;
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

  let cases = allCases.slice();
  if(statusFilter !== 'all'){
    cases = cases.filter(function(m){ return (m.status || '待處理') === statusFilter; });
  }
  if(searchTerm){
    cases = cases.filter(function(m){
      return (m.reqName || '').toLowerCase().indexOf(searchTerm) !== -1 ||
        (m.reqPerson || '').toLowerCase().indexOf(searchTerm) !== -1 ||
        (m.brand || '').toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  if(sortMode === 'dueAsc' || sortMode === 'dueDesc'){
    cases.sort(function(a,b){
      const da = parseDate(a.dueDate), db = parseDate(b.dueDate);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return sortMode === 'dueAsc' ? da - db : db - da;
    });
  }else if(sortMode === 'fillDesc' || sortMode === 'fillAsc'){
    cases.sort(function(a,b){
      const da = parseDate(a.fillDate), db = parseDate(b.fillDate);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return sortMode === 'fillAsc' ? da - db : db - da;
    });
  }

  window.__cases = cases;

  if(cases.length === 0){
    list.innerHTML = '<div class="state-msg">沒有符合篩選條件的案件。</div>';
    return;
  }

  if(statusFilter !== 'all'){
    // 已篩選成單一狀態，直接平鋪顯示，不用疊卡
    list.innerHTML = cases.map(renderCaseCard).join('');
    initCaseFieldVisibility();
    scrollToDeepLinkedCase();
    return;
  }

  // 「全部」：依狀態分組，同狀態疊成一疊卡片
  const params = new URLSearchParams(window.location.search);
  const deepLinkCaseId = (params.get('case') || '').trim();

  const groups = {};
  STATUS_ORDER.forEach(function(s){ groups[s] = []; });
  cases.forEach(function(c){
    const s = STATUS_ORDER.indexOf(c.status) !== -1 ? c.status : '待處理';
    groups[s].push(c);
  });

  list.innerHTML = STATUS_ORDER.filter(function(s){ return groups[s].length > 0; }).map(function(s){
    const groupCases = groups[s];
    const hasDeepLinkTarget = !!deepLinkCaseId && groupCases.some(function(c){ return c.id === deepLinkCaseId; });
    return renderStatusGroup(s, groupCases, hasDeepLinkTarget);
  }).join('');

  initCaseFieldVisibility();
  scrollToDeepLinkedCase();
}

const STATUS_ORDER = ['待處理','進行中','請校稿','停案','已完成','退件'];

function renderStatusGroup(status, groupCases, expanded){
  const groupKey = STATUS_ORDER.indexOf(status) >= 0 ? STATUS_ORDER.indexOf(status) : 'x';
  const groupId = 'statusGroup-' + groupKey;
  const si = statusInfo(status);
  const isSingle = groupCases.length === 1;
  const listHtml = '<div class="status-group-list">' + groupCases.map(renderCaseCard).join('') + '</div>';

  if(isSingle){
    // 只有一筆的話直接展開顯示，不用疊卡樣式
    return '<div class="status-group expanded" id="' + groupId + '">' + listHtml + '</div>';
  }

  const stackHtml =
    '<div class="stack-card" onclick="toggleStatusGroup(\'' + groupId + '\')">' +
      '<div class="stack-front" style="background:var(--card);">' +
        '<div class="stack-front-left">' +
          '<span class="stack-status-label" style="color:' + si.fg + ';">' + si.label + '</span>' +
          '<span class="stack-count" style="color:' + si.fg + ';">' + groupCases.length + ' 件</span>' +
        '</div>' +
        '<span class="stack-chevron" style="color:var(--ink-faint);"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>' +
      '</div>' +
    '</div>';

  const collapseHeaderHtml =
    '<button type="button" class="status-group-collapse" onclick="toggleStatusGroup(\'' + groupId + '\')">' +
      '<span class="status-group-collapse-dot" style="background:' + si.fg + ';"></span>' +
      '<span>' + si.label + '（' + groupCases.length + ' 件）－ 點擊收合</span>' +
    '</button>';

  return '<div class="status-group' + (expanded ? ' expanded' : '') + '" id="' + groupId + '">' +
    stackHtml +
    collapseHeaderHtml +
    listHtml +
  '</div>';
}

function toggleStatusGroup(groupId){
  const el = document.getElementById(groupId);
  if(el) el.classList.toggle('expanded');
}

// ---- LINE 深連結：網址帶 ?case=<id> 時，自動捲動並標亮該案件卡片（只做一次）----
let __deepLinkHandled = false;
function scrollToDeepLinkedCase(){
  if(__deepLinkHandled) return;
  const params = new URLSearchParams(window.location.search);
  const caseId = (params.get('case') || '').trim();
  if(!caseId) return;

  let attempts = 0;
  const maxAttempts = 10;
  const tryFind = function(){
    const el = document.getElementById('card-' + caseId);
    if(el){
      __deepLinkHandled = true;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('deep-link-highlight');
      setTimeout(function(){ el.classList.remove('deep-link-highlight'); }, 2600);
      return;
    }
    attempts++;
    if(attempts < maxAttempts){
      setTimeout(tryFind, 300);
    }else{
      console.warn('deep-link: 找不到 case=' + caseId + ' 對應的卡片，可能是這筆案件不屬於目前登入的設計師，或 ID 不吻合。');
    }
  };
  setTimeout(tryFind, 150);
}

function toggleCaseBody(id){
  const body = document.getElementById('caseBody-' + id);
  const chevron = document.getElementById('caseToggleChevron-' + id);
  const card = body.closest('.case-card') || body.parentElement;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);

  if(!isOpen){
    // 等展開動畫跑完再計算
    setTimeout(function(){
      const cardBottom = card.getBoundingClientRect().bottom;
      const viewHeight = window.innerHeight;
      if(cardBottom > viewHeight - 20){
        window.scrollBy({ top: cardBottom - viewHeight + 40, behavior:'smooth' });
      }
    }, 420);
  }
}

function toggleCaseFields(id){
  const status = document.getElementById('status-' + id).value;
  document.getElementById('rejectWrap-' + id).style.display = (status === '退件') ? 'block' : 'none';
}

// 初始依現有狀態決定要不要展開對應欄位，並初始化每張卡片自己的狀態下拉選單
function initCaseFieldVisibility(){
  const statusOptions = STATUS_OPTIONS.map(function(s){ return { value: s, label: s }; });
  (window.__cases || []).forEach(function(m){
    initCsel('status-' + m.id, statusOptions, m.status || '待處理', function(v, oldV){ onStatusChange(m.id, v, oldV); });
    toggleCaseFields(m.id);
  });
}

// 選到「停案」時跳出必填原因的視窗，其他狀態切換維持原本行為
function onStatusChange(id, newValue, oldValue){
  toggleCaseFields(id);
  if(newValue === '停案' && oldValue !== '停案'){
    openPauseReasonModal(id, oldValue);
  }
}

function saveCase(id){
  const status = document.getElementById('status-' + id).value;
  const rejectEl = document.getElementById('reject-' + id);
  const deliveryEl = document.getElementById('delivery-' + id);
  const hoursEl = document.getElementById('hours-' + id);
  const feeEl = document.getElementById('fee-' + id);
  const msg = document.getElementById('saveMsg-' + id);
  const btn = document.getElementById('saveBtn-' + id);
  const btnText = document.getElementById('saveBtnText-' + id);

  msg.textContent = '';
  msg.className = 'save-msg';
  btn.disabled = true;
  btnText.textContent = '儲存中...';

  return designerAction('saveCase', {
    id: id,
    status: status,
    reject_reason: (status === '退件' && rejectEl) ? rejectEl.value : '',
    delivery_link: deliveryEl ? deliveryEl.value : '',
    hours: (hoursEl && hoursEl.value) ? parseFloat(hoursEl.value) : null,
    fee: (feeEl && feeEl.value) ? parseFloat(feeEl.value) : null
  })
  .then(function(result){
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    btnText.textContent = '儲存';
    btn.classList.add('success-state');
    setTimeout(function(){
      btn.classList.remove('success-state');
      btn.disabled = false;
    }, 1400);
    return true;
  })
  .catch(function(err){
    msg.textContent = '儲存失敗：' + (err && err.message ? err.message : '未知錯誤');
    msg.className = 'save-msg error';
    btnText.textContent = '儲存';
    btn.disabled = false;
    return false;
  });
}

function saveAllCases(){
  const btn = document.getElementById('saveAllBtn');
  const msg = document.getElementById('saveAllMsg');
  const cases = window.__cases || [];
  if(cases.length === 0){
    msg.textContent = '目前沒有可儲存的案件';
    msg.className = 'save-all-msg error';
    return;
  }

  btn.disabled = true;
  msg.textContent = '儲存中（共 ' + cases.length + ' 筆）...';
  msg.className = 'save-all-msg';

  Promise.all(cases.map(function(m){ return saveCase(m.id); })).then(function(results){
    btn.disabled = false;
    const successCount = results.filter(function(r){ return r === true; }).length;
    const failCount = results.length - successCount;
    if(failCount === 0){
      msg.textContent = '✓ 全部 ' + successCount + ' 筆已儲存';
      msg.className = 'save-all-msg success';
    }else{
      msg.textContent = '完成 ' + successCount + ' 筆，' + failCount + ' 筆失敗（詳見各卡片訊息）';
      msg.className = 'save-all-msg error';
    }
  });
}

// ---- 封鎖日期 ----
let lockCalendarDate = new Date();
let lockedDatesMap = {}; // { 'YYYY-MM-DD': reason }
let pendingLockDate = null;

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function toDateStr(y,m,d){ return y + '-' + pad2(m+1) + '-' + pad2(d); }
function normalizeDateStr(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return null;
  return m[1] + '-' + pad2(parseInt(m[2],10)) + '-' + pad2(parseInt(m[3],10));
}

function openLockModal(){
  document.getElementById('lockModalOverlay').classList.add('show');
  loadLockedDates();
}

function closeLockModal(){
  document.getElementById('lockModalOverlay').classList.remove('show');
}

function loadLockedDates(){
  fetch(sbUrl('locked_dates', 'handler=eq.' + encodeURIComponent(CURRENT_DESIGNER)), {
    headers: SUPABASE_HEADERS
  })
  .then(function(res){ return res.json(); })
  .then(function(rows){
    const map = {};
    rows.forEach(function(r){
      if(r.date) map[r.date] = r.reason || '';
    });
    lockedDatesMap = map;
  })
  .catch(function(){ lockedDatesMap = {}; })
  .finally(function(){ renderLockCalendar(); });
}

function changeLockMonth(delta){
  lockCalendarDate.setMonth(lockCalendarDate.getMonth() + delta);
  renderLockCalendar();
}

function caseCountsByDate(){
  const counts = {};
  (window.__allCases || []).forEach(function(c){
    const d = normalizeDateStr(c.dueDate);
    if(!d) return;
    counts[d] = (counts[d] || 0) + 1;
  });
  return counts;
}

function renderLockCalendar(){
  const y = lockCalendarDate.getFullYear();
  const m = lockCalendarDate.getMonth();
  document.getElementById('lockCalMonthLabel').textContent = y + ' 年 ' + (m+1) + ' 月';

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const now = new Date();
  const todayStr = toDateStr(now.getFullYear(), now.getMonth(), now.getDate());
  const counts = caseCountsByDate();

  let html = '';
  for(let i=0;i<firstDay;i++){ html += '<div class="cal-day empty"></div>'; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = toDateStr(y, m, d);
    const isLocked = lockedDatesMap.hasOwnProperty(dateStr);
    const count = counts[dateStr] || 0;
    let cls = 'cal-day';
    if(isLocked) cls += ' locked';
    if(dateStr === todayStr) cls += ' today';
    html += '<div class="' + cls + '" onclick="onLockDayClick(\'' + dateStr + '\')">' +
      '<span>' + d + '</span>' +
      (count > 0 ? '<span class="case-count">' + count + '件</span>' : '') +
    '</div>';
  }
  document.getElementById('lockCalGrid').innerHTML = html;
}

function onLockDayClick(dateStr){
  if(lockedDatesMap.hasOwnProperty(dateStr)){
    const reason = lockedDatesMap[dateStr];
    const ok = confirm('解除封鎖 ' + dateStr + '？' + (reason ? '（原因：' + reason + '）' : ''));
    if(ok) doUnlockDate(dateStr);
  }else{
    pendingLockDate = dateStr;
    document.getElementById('lockReasonDate').textContent = dateStr;
    document.getElementById('lockReasonInput').value = '';
    document.getElementById('lockModalMsg').textContent = '';
    document.getElementById('lockReasonOverlay').classList.add('show');
  }
}

function closeLockReasonModal(){
  document.getElementById('lockReasonOverlay').classList.remove('show');
  pendingLockDate = null;
}

// ---- 停案原因彈窗 ----
let pendingPauseCaseId = null;
let pendingPausePrevStatus = null;

function openPauseReasonModal(id, prevStatus){
  pendingPauseCaseId = id;
  pendingPausePrevStatus = prevStatus || '待處理';
  const c = (window.__cases || []).filter(function(m){ return m.id === id; })[0];
  document.getElementById('pauseReasonCaseName').textContent = c ? c.reqName : '';
  document.getElementById('pauseReasonInput').value = '';
  document.getElementById('pauseReasonModalMsg').textContent = '';
  document.getElementById('pauseReasonModalMsg').className = 'modal-msg';
  document.getElementById('pauseReasonOverlay').classList.add('show');
  setTimeout(function(){ document.getElementById('pauseReasonInput').focus(); }, 100);
}

function cancelPauseCase(){
  if(pendingPauseCaseId){
    cselSetValueSilent('status-' + pendingPauseCaseId, pendingPausePrevStatus);
    toggleCaseFields(pendingPauseCaseId);
  }
  document.getElementById('pauseReasonOverlay').classList.remove('show');
  pendingPauseCaseId = null;
  pendingPausePrevStatus = null;
}

function confirmPauseCase(){
  const id = pendingPauseCaseId;
  if(!id) return;
  const reason = document.getElementById('pauseReasonInput').value.trim();
  const msg = document.getElementById('pauseReasonModalMsg');
  const btn = document.getElementById('pauseReasonSubmitBtn');

  if(!reason){
    msg.textContent = '請先填寫停案原因';
    msg.className = 'modal-msg error';
    return;
  }

  btn.disabled = true;
  msg.textContent = '處理中...';
  msg.className = 'modal-msg';

  designerAction('pauseCase', { id: id, reason: reason })
  .then(function(result){
    btn.disabled = false;
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    document.getElementById('pauseReasonOverlay').classList.remove('show');
    pendingPauseCaseId = null;
    pendingPausePrevStatus = null;
    loadCases();
  })
  .catch(function(err){
    btn.disabled = false;
    msg.textContent = '停案失敗：' + (err && err.message ? err.message : '未知錯誤');
    msg.className = 'modal-msg error';
  });
}

function confirmLockDate(){
  if(!pendingLockDate) return;
  const reason = document.getElementById('lockReasonInput').value.trim();
  const msg = document.getElementById('lockModalMsg');
  msg.textContent = '處理中...';
  msg.className = 'modal-msg';

  designerAction('lockDate', { date: pendingLockDate, reason: reason })
  .then(function(result){
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    lockedDatesMap[pendingLockDate] = reason;
    closeLockReasonModal();
    renderLockCalendar();
  })
  .catch(function(err){
    msg.textContent = '失敗：' + (err && err.message ? err.message : '未知錯誤');
    msg.className = 'modal-msg error';
  });
}

function doUnlockDate(dateStr){
  designerAction('unlockDate', { date: dateStr })
  .then(function(result){
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    delete lockedDatesMap[dateStr];
    renderLockCalendar();
  })
  .catch(function(err){ alert('解除失敗：' + (err && err.message ? err.message : '未知錯誤')); });
}

// ---- 評價回覆 ----
let currentReplyId = null;

function openReplyModal(id, reqName){
  currentReplyId = id;
  const m = (window.__cases || []).find(function(c){ return c.id === id; });
  document.getElementById('replyModalReqName').textContent = reqName;
  document.getElementById('replyText').value = (m && m.designerReply) || '';
  document.getElementById('replyModalMsg').textContent = '';
  document.getElementById('replyModalMsg').className = 'modal-msg';
  document.getElementById('replyModalOverlay').classList.add('show');
}

function closeReplyModal(){
  document.getElementById('replyModalOverlay').classList.remove('show');
  currentReplyId = null;
}

function saveReply(){
  const text = document.getElementById('replyText').value.trim();
  const msg = document.getElementById('replyModalMsg');
  if(!text){
    msg.textContent = '請先輸入回覆內容';
    msg.className = 'modal-msg error';
    return;
  }
  const btn = document.getElementById('replySubmitBtn');
  btn.disabled = true;
  msg.textContent = '送出中...';
  msg.className = 'modal-msg';

  designerAction('replyRating', { id: currentReplyId, reply: text })
  .then(function(result){
    btn.disabled = false;
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    msg.textContent = '✓ 已送出回覆';
    msg.className = 'modal-msg success';
    setTimeout(function(){
      closeReplyModal();
      loadCases();
    }, 800);
  })
  .catch(function(err){
    btn.disabled = false;
    msg.textContent = '送出失敗：' + (err && err.message ? err.message : '未知錯誤');
    msg.className = 'modal-msg error';
  });
}

// ---- 設計歷程 ----
function addDesignHistory(id){
  const input = document.getElementById('historyInput-' + id);
  const text = input.value.trim();
  const msg = document.getElementById('historyMsg-' + id);
  if(!text){
    msg.textContent = '請先輸入內容';
    msg.style.color = '#B3324A';
    return;
  }
  msg.textContent = '送出中...';
  msg.style.color = 'var(--ink-soft)';

  designerAction('addDesignHistory', { id: id, content: text })
  .then(function(result){
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    msg.textContent = '';
    input.value = '';
    loadCases();
  })
  .catch(function(err){
    msg.textContent = '送出失敗：' + (err && err.message ? err.message : '未知錯誤');
    msg.style.color = '#B3324A';
  });
}
</script>
