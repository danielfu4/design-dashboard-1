<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的需求查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F1F3; --card:#FFFFFF;
    --shadow:0 1px 2px rgba(20,20,30,.05), 0 6px 16px rgba(20,20,30,.04);
    --ink:#17181C; --ink-soft:#8A8A93; --ink-faint:#C2C2C8; --line:#ECECEE;
    --accent:#3E7BFA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',ui-sans-serif,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:680px;margin:0 auto;}

  .top-links{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);
    text-decoration:none;font-weight:600;
  }
  .back-link:hover{color:var(--ink);}
  .new-link{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
    font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;text-decoration:none;
  }
  .new-link:hover{opacity:.9;}

  header{margin-bottom:22px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 4px;text-transform:uppercase;}
  h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .subtitle{font-size:13px;color:var(--ink-soft);}

  .search-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px;}

  .filter-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-field{display:flex;flex-direction:column;gap:6px;width:200px;}
  .filter-field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .filter-field.search-field{flex:1;min-width:220px;width:auto;}
  .filter-field.search-field input{
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:inherit;font-size:13px;color:var(--ink);background:#FAFAFB;box-sizing:border-box;
  }
  .filter-field.search-field input:focus{outline:none;border-color:var(--accent);background:#fff;}

  .csel{position:relative;}
  .csel-trigger{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);background:#FAFAFB;cursor:pointer;text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .csel-trigger:hover{background:#F5F5F6;}
  .csel.open .csel-trigger{border-color:var(--accent);background:#fff;}
  .csel-arrow{color:var(--ink-soft);transition:transform .15s ease;flex:none;display:flex;}
  .csel.open .csel-arrow{transform:rotate(180deg);}
  .csel-panel{
    display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
    background:#fff;border-radius:14px;box-shadow:0 14px 32px rgba(20,20,30,.16);
    padding:6px;max-height:220px;overflow-y:auto;
  }
  .csel-panel.show{display:block;}
  .csel-item{padding:9px 12px;border-radius:9px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .csel-item + .csel-item{margin-top:3px;}
  .csel-item:hover{background:#F1F1F3;}
  .csel-item.selected{background:#F1F1F3;font-weight:700;}
  .search-row{display:flex;gap:10px;}
  .search-row input{
    flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    font-family:inherit;font-size:14px;color:var(--ink);background:#FAFAFB;
  }
  .search-row input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .search-row button{
    border:none;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:14px;
    padding:11px 22px;border-radius:12px;cursor:pointer;white-space:nowrap;
  }
  .search-row button:hover{opacity:.88;}
  .search-hint{font-size:11.5px;color:var(--ink-soft);margin-top:10px;}

  .state-msg{
    text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 20px;
  }

  .req-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px;}
  .req-card.deep-link-highlight{animation:deepLinkPulse2 2.6s ease;}
  @keyframes deepLinkPulse2{
    0%{box-shadow:0 0 0 3px #3E7BFA, var(--shadow);}
    70%{box-shadow:0 0 0 3px #3E7BFA, var(--shadow);}
    100%{box-shadow:var(--shadow);}
  }
  .req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .req-name{font-size:16px;font-weight:800;}
  .badge-group{display:flex;align-items:center;gap:6px;flex:none;}
  .req-top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}

  .progress-bar{display:flex;align-items:flex-start;}
  .progress-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;width:64px;}
  .progress-dot{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
    background:#D3E2FF;box-sizing:border-box;transition:background-color .2s ease, border-color .2s ease;
  }
  .progress-step.done .progress-dot{background:var(--accent);}
  .progress-step.current .progress-dot{background:#fff;border:2.5px solid var(--accent);}
  .progress-step.current .inner-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .progress-label{font-size:11px;color:#B7C6E8;white-space:nowrap;}
  .progress-step.current .progress-label{color:var(--ink);font-weight:700;}
  .progress-step.done .progress-label{color:var(--ink-soft);}
  .progress-line{flex:1;height:2px;background:#E4E4E8;margin:12px -10px 0;min-width:38px;}
  .progress-line.done{background:var(--accent);}

  .completed-rating-row{display:flex;align-items:center;justify-content:space-between;}
  .completed-rating-label{font-size:13px;font-weight:700;color:#1F8A4C;display:flex;align-items:center;gap:5px;}
  .score-stars{display:flex;gap:2px;}
  .score-stars svg{display:block;}
  .reply-shown-block{background:#EAF1FF;}
  .urgent-badge{
    display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#C4372B;
    background:#FFF0EE;padding:5px 10px;border-radius:999px;white-space:nowrap;
  }
  .req-card.urgent{box-shadow:0 0 0 1.5px #F3C5C0, 0 6px 16px rgba(20,20,30,.04);}
  .urgent-block{
    background:#FFF8F7;border:1px solid #F7D4CE;border-radius:18px;padding:16px 16px 4px;margin-bottom:20px;
  }
  .urgent-block-head{
    font-size:13px;font-weight:800;color:#C4372B;margin-bottom:12px;padding-left:4px;
  }
  .urgent-block .req-card{box-shadow:none;border:1px solid #F0DAD6;}
  .req-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .req-tag{
    font-size:11px;font-weight:700;color:var(--ink-soft);background:#F1F1F3;
    padding:3px 9px;border-radius:7px;
  }
  .status-badge{
    font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap;flex:none;
  }
  .req-meta{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.8;}
  .case-toggle-btn{
    display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
    margin-top:12px;padding:8px;border:none;border-top:1px solid var(--line);background:none;
    font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .case-toggle-btn:hover{color:var(--ink);}
  .case-toggle-chevron{display:flex;transition:transform .2s ease;}
  .case-toggle-chevron.open{transform:rotate(180deg);}
  .case-body{
    overflow:hidden;max-height:0;opacity:0;transform:translateY(-8px);
    transition:max-height .4s ease, opacity .3s ease, transform .3s ease;
  }
  .case-body.open{max-height:4000px;opacity:1;transform:translateY(0);}
  .req-meta b{color:var(--ink);font-weight:700;}
  .reject-box{
    margin-top:12px;background:#FBEBEA;border:1px solid #F3C5C0;border-radius:12px;
    padding:12px 14px;font-size:12.5px;color:#B3324A;
  }
  .reject-box b{display:block;margin-bottom:4px;font-size:11.5px;letter-spacing:.03em;}

  .detail-block{
    margin-top:12px;background:#F7F7F8;border-radius:12px;padding:12px 14px;
    font-size:12.5px;color:var(--ink);white-space:pre-line;line-height:1.6;
  }
  .detail-block .label{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .supplement-btn{
    display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
  }
  .change-date-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
    transition:background-color .15s ease;
  }
  .change-date-btn:hover{background:#F7F7F8;}
  .copy-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
    transition:background-color .15s ease, transform .15s ease;
  }
  .copy-btn:hover{background:#F7F7F8;}
  .copy-btn:active{transform:scale(.94);}
  .supplement-btn:hover{background:#F7F7F8;}

  .field-simple{margin-bottom:14px;}
  .field-simple label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .field-simple textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:#FAFAFB;resize:vertical;
  }
  .field-simple textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
  .field-simple select, .field-simple input[type="date"], .field-simple input[type="text"]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:#FAFAFB;box-sizing:border-box;
  }
  .field-simple select:focus, .field-simple input[type="date"]:focus, .field-simple input[type="text"]:focus{outline:none;border-color:var(--accent);background:#fff;}
  .copy-date-hint{font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
  .copy-date-warning{
    display:none;background:#FBEBEA;border:1px solid #F3C5C0;color:#B3324A;font-size:11.5px;
    line-height:1.6;border-radius:8px;padding:8px 10px;margin-top:8px;
  }
  .copy-date-warning.show{display:block;}
  .copy-urgent-label{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#C4372B;
    margin-bottom:14px;cursor:pointer;
  }

  .date-field{position:relative;}
  .date-picker-input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:#FAFAFB;box-sizing:border-box;
    cursor:pointer;
  }
  .calendar-popup{
    display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 12px 30px rgba(20,20,30,.16);padding:14px;width:280px;
  }
  .calendar-popup.show{display:block;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-header button{
    border:none;background:#F1F1F3;color:var(--ink);width:28px;height:28px;border-radius:8px;
    cursor:pointer;font-size:15px;font-weight:700;
  }
  .cal-header button:hover{background:#E7E7EA;}
  #copyCalMonthLabel, #editCalMonthLabel{font-size:13.5px;font-weight:800;font-family:inherit;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    font-size:12.5px;border-radius:8px;cursor:pointer;color:var(--ink);
    transition:background-color .2s ease, color .2s ease;
  }
  .cal-day:hover{background:#F1F1F3;}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day.blocked{color:var(--ink-faint);background:#F6F6F7;text-decoration:line-through;cursor:not-allowed;}
  .cal-day.manually-locked{color:#B3324A;background:#FBEBEA;}
  .cal-day.blocked:hover{background:#F6F6F7;}
  .cal-day.selected{background:var(--accent);color:#fff;font-weight:700;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .cal-day-num{transition:opacity .2s ease;}
  .cal-day-count{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;font-weight:800;color:#fff;transition:opacity .2s ease;pointer-events:none;
  }
  #copyCalGrid .cal-day:not(.empty):not(.blocked):hover{background:var(--accent);color:#fff;}
  #copyCalGrid .cal-day:not(.empty):not(.blocked):hover .cal-day-num{opacity:0;}
  #copyCalGrid .cal-day:not(.empty):not(.blocked):hover .cal-day-count{opacity:1;}
  .cal-hover-tag{
    position:fixed;z-index:400;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;
    padding:6px 11px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .15s ease;
    white-space:nowrap;box-shadow:0 6px 16px rgba(20,20,30,.18);
  }
  .cal-hover-tag.show{opacity:1;}
  .cal-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-top:10px;}
  .cal-legend .cal-dot{width:8px;height:8px;border-radius:2px;background:#F6F6F7;box-shadow:inset 0 0 0 1px var(--ink-faint);}

  .rate-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .action-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .action-row-left{display:flex;gap:8px;flex-wrap:wrap;}
  .close-case-btn{
    display:inline-flex;align-items:center;border:none;background:#1F8A4C;color:#fff;
    font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:10px;cursor:pointer;
    margin-left:auto;
  }
  .close-case-btn:hover{opacity:.88;}
  .fix-case-btn{
    display:inline-flex;align-items:center;gap:6px;border:none;background:#B3324A;color:#fff;
    font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:10px;cursor:pointer;
    margin-left:auto;
  }
  .fix-case-btn:hover{opacity:.88;}
  .rate-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;
    border-radius:10px;cursor:pointer;
  }
  .rate-btn:hover{background:#F7F7F8;}
  .rated-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#1F8A4C;
  }
  .delivery-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
    font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:10px;text-decoration:none;
  }
  .delivery-btn:hover{opacity:.9;}
  .cloud-icon{flex:none;}
  .cloud-arrow{transition:transform .3s ease-in-out;transform-box:fill-box;}
  .delivery-btn:hover .cloud-arrow{animation:cloud-arrow-down .6s ease-in-out infinite alternate;}
  @keyframes cloud-arrow-down{
    from{transform:translateY(0);}
    to{transform:translateY(3px);}
  }

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:200;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(20,20,30,.3);
    padding:26px 26px 22px;max-width:380px;width:100%;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-title{font-size:16px;font-weight:800;}
  .modal-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .modal-close{border:none;background:none;font-size:18px;color:var(--ink-faint);cursor:pointer;line-height:1;}
  .modal-head-right{display:flex;flex-direction:row;align-items:center;gap:10px;}
  .rate-score-badge{
    font-size:15px;font-weight:800;color:var(--accent);background:#EAF1FF;
    padding:5px 12px;border-radius:999px;white-space:nowrap;transition:color .2s ease, background-color .2s ease;
  }
  .modal-close:hover{color:var(--ink);}
  .star-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .star-row .crit-label{font-size:13.5px;font-weight:700;}
  .star-picker{
    display:flex;justify-content:flex-start;gap:6px;flex-direction:row-reverse;
  }
  .star-picker > input{position:absolute;appearance:none;}
  .star-picker > label{
    cursor:pointer;font-size:26px;position:relative;display:inline-block;
    transition:transform .3s ease;
  }
  .star-picker > label > svg{fill:#C2C2C8;transition:fill .3s ease;}
  .star-picker > label:hover{transform:scale(1.15);}
  .star-picker > label:hover > svg,
  .star-picker > label:hover ~ label > svg{
    fill:#F5A623;filter:drop-shadow(0 0 5px rgba(245,166,35,.7));
  }
  .star-picker > input:checked + label > svg,
  .star-picker > input:checked + label ~ label > svg{
    fill:#F5A623;filter:drop-shadow(0 0 5px rgba(245,166,35,.7));
  }
  .reason-block{
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .35s ease, opacity .3s ease, margin .35s ease;
    margin-bottom:0;
  }
  .reason-block.show{max-height:160px;opacity:1;margin-bottom:16px;}
  .reason-block-inner{
    background:#EAF1FF;border:1px solid #C7DBFF;border-radius:12px;padding:12px 14px;
  }
  .reason-block-inner label{
    display:block;font-size:12px;font-weight:700;color:#2F5FD6;margin-bottom:8px;
  }
  .reason-block-inner textarea{
    width:100%;border:1px solid #B9D2FF;border-radius:10px;padding:9px 11px;
    font-family:inherit;font-size:13px;color:var(--ink);background:#fff;resize:vertical;min-height:64px;
    box-sizing:border-box;
  }
  .reason-block-inner textarea:focus{outline:none;border-color:var(--accent);}
  .modal-submit{
    width:100%;margin-top:6px;border:none;background:var(--ink);color:#fff;font:inherit;font-weight:700;
    font-size:14px;padding:12px;border-radius:12px;cursor:pointer;
  }
  .modal-submit:hover{opacity:.88;}
  .rate-submit-btn{position:relative;overflow:hidden;}
  .submit-success-check{
    position:absolute;inset:0;background:var(--ink);border-radius:inherit;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .rate-submit-btn.success-state .submit-success-check{opacity:1;}
  .submit-success-check .check-mark{
    stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .35s ease .15s;
  }
  .rate-submit-btn.success-state .submit-success-check .check-mark{stroke-dashoffset:0;}
  .modal-msg{font-size:12px;margin-top:10px;text-align:center;}
  .modal-msg.error{color:#B3324A;}
  .modal-msg.success{color:#1F8A4C;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top-links">
    <a class="back-link" href="design-request-form.html" onclick="if(window.history.length>1){history.back();return false;}">← 返回設計需求申請單</a>
    <a class="new-link" href="design-request-form.html">＋ 填寫新需求</a>
  </div>

  <header>
    <p class="eyebrow">ITD設計團隊</p>
    <h1>我的需求查詢</h1>
    <div class="subtitle">輸入填單時填寫的「需求人員」姓名，或輸入品牌名稱，查詢送出過的需求進度</div>
  </header>

  <div class="search-card">
    <form class="search-row" onsubmit="return doSearch(event)">
      <input type="text" id="searchName" placeholder="請輸入你的姓名或品牌名稱" autocomplete="off">
      <button type="submit">查詢</button>
    </form>

<script>
// ---- 自訂下拉選單元件（放最前面，確保其他程式碼執行時已經可用）----
const cselState = {};

function cselSetOptions(id, options, placeholder){
  if(!cselState[id]) cselState[id] = {};
  cselState[id].options = options;
  if(placeholder) cselState[id].placeholder = placeholder;
  renderCselPanel(id);
}

function renderCselPanel(id){
  const st = cselState[id];
  const panel = document.getElementById('csel_' + id + '_panel');
  if(!panel || !st.options) return;
  panel.innerHTML = st.options.map(function(opt){
    const selected = opt.value === st.value;
    const safeVal = opt.value.replace(/'/g, "\\'");
    return '<div class="csel-item' + (selected ? ' selected' : '') + '" onclick="cselChoose(\'' + id + '\',\'' + safeVal + '\')">' + opt.label + '</div>';
  }).join('');
}

function cselChoose(id, val){
  const st = cselState[id];
  const opt = st.options.filter(function(o){ return o.value === val; })[0];
  st.value = val;
  const hiddenEl = document.getElementById(id);
  if(hiddenEl) hiddenEl.value = val;
  const textEl = document.getElementById('csel_' + id + '_text');
  if(textEl) textEl.textContent = opt ? opt.label : val;
  closeAllCsel();
  renderCselPanel(id);
  if(st.onChange) st.onChange(val);
}

function toggleCsel(id){
  const panel = document.getElementById('csel_' + id + '_panel');
  const wasOpen = panel.classList.contains('show');
  closeAllCsel();
  if(!wasOpen){
    panel.classList.add('show');
    document.getElementById('csel_' + id).classList.add('open');
  }
}

function closeAllCsel(){
  document.querySelectorAll('.csel-panel.show').forEach(function(p){ p.classList.remove('show'); });
  document.querySelectorAll('.csel.open').forEach(function(c){ c.classList.remove('open'); });
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.csel')) closeAllCsel();
});

function initCsel(id, options, value, onChange){
  const opt = options.filter(function(o){ return o.value === value; })[0];
  cselState[id] = { options: options, value: value, placeholder: options[0] ? options[0].label : '', onChange: onChange };
  const textEl = document.getElementById('csel_' + id + '_text');
  if(textEl) textEl.textContent = opt ? opt.label : (options[0] ? options[0].label : '');
  renderCselPanel(id);
}

function formatDateStr(val){
  if(!val) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(val).trim())) return String(val).trim();
  const d = new Date(val);
  if(isNaN(d.getTime())) return String(val);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function cellText(c){
  if(!c) return '';
  if(c.f !== undefined && c.f !== null && c.f !== '') return c.f;

}

const SCORE_STAR_PATH = 'M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z';

function scoreStarsHtml(score){
  const filled = Math.round(score / 20);
  let html = '<div class="score-stars">';
  for(let i=1;i<=5;i++){
    html += '<svg viewBox="0 0 576 512" width="16" height="16" xmlns="http://www.w3.org/2000/svg" style="fill:' +
      (i <= filled ? '#F5A623' : '#E4E4E8') + '"><path d="' + SCORE_STAR_PATH + '"></path></svg>';
  }
  html += '</div>';
  return html;
}

function parseListDate(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return null;
  return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10)).getTime();
}

    case '已完成': return {label:s, bg:'#EAF7EF', fg:'#1F8A4C'};

  }

function doSearch(e){
  if(e) e.preventDefault();
  const name = document.getElementById('searchName').value.trim();
  const results = document.getElementById('results');
  if(!name){
    results.innerHTML = '<div class="state-msg">請先輸入姓名或品牌名稱再查詢</div>';
    return false;
  }
  results.innerHTML = '<div class="state-msg">查詢中...</div>';

  const orQuery = 'or=(req_person.eq.' + encodeURIComponent(name) + ',brand.ilike.*' + encodeURIComponent(name) + '*)';
  fetch(sbUrl('cases', orQuery + '&limit=500&order=created_at.desc'),{headers:SUPABASE_HEADERS})
  .then(function(res){ return res.ok ? res.json() : []; })
  .then(function(rows){
    renderResults(rows, name);
  })
  .catch(function(err){
    results.innerHTML = '<div class="state-msg">資料讀取失敗：'+(err.message||'未知錯誤')+'</div>';
  });
  return false;
}

const PROGRESS_STEPS = ['待處理', '進行中', '請校稿', '已完成'];

function progressBarHtml(status){
  const clean = (status || '').replace(/\s/g, '');
  if(clean === '退件') return '';
  let idx = PROGRESS_STEPS.indexOf(clean);
  if(idx === -1) idx = 0;
  let html = '<div class="progress-bar" title="原始狀態文字：[' + (status || '') + ']　比對後：[' + clean + ']">';
  PROGRESS_STEPS.forEach(function(label, i){
    let stepClass = 'progress-step';
    if(i < idx) stepClass += ' done';
    else if(i === idx) stepClass += ' current';
    else stepClass += ' upcoming';
    const dotInner = i < idx
      ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
      : (i === idx ? '<span class="inner-dot"></span>' : '');
    html += '<div class="' + stepClass + '">' +
      '<div class="progress-dot">' + dotInner + '</div>' +
      '<div class="progress-label">' + label + '</div>' +
    '</div>';
    if(i < PROGRESS_STEPS.length - 1){
      html += '<div class="progress-line' + (i < idx ? ' done' : '') + '"></div>';
    }
  });
  html += '</div>';
  return html;
}

function renderResults(rows, name){
  const results = document.getElementById('results');
  if(!rows || !rows.length){
    results.innerHTML = '<div class="state-msg">查無「' + name + '」的需求紀錄，請確認姓名是否與填單時完全一致，或確認品牌名稱是否正確。</div>';
    return;
  }
  const matches = rows.map(function(r){
    return {
      submitTime:   formatDateStr(r.created_at),
      brand:        r.brand || '',
      reqType:      r.req_type || '',
      reqName:      r.req_name || '',
      reqPerson:    r.req_person || '',
      fillDate:     formatDateStr(r.fill_date),
      dueDate:      formatDateStr(r.due_date),
      materials:    r.materials || '',
      notes:        r.notes || '',
      status:       r.status || '待處理',
      rejectReason: r.reject_reason || '',
      handler:      r.handler || '',
      groupTag:     r.group_name || '',
      id:           r.id || '',
      quality:      r.rating_quality !== null && r.rating_quality !== undefined ? String(r.rating_quality) : '',
      efficiency:   r.rating_efficiency !== null && r.rating_efficiency !== undefined ? String(r.rating_efficiency) : '',
      communication:r.rating_communication !== null && r.rating_communication !== undefined ? String(r.rating_communication) : '',
      price:        r.rating_price !== null && r.rating_price !== undefined ? String(r.rating_price) : '',
      deliveryLink: r.delivery_link || '',
      isUrgent:     r.is_urgent || '',
      caseType:     r.case_type || '',
      caseFields:   r.case_fields || '',
      channel:      r.channel || '',
      hours:        r.hours !== null && r.hours !== undefined ? String(r.hours) : '',
      fee:          r.fee !== null && r.fee !== undefined ? String(r.fee) : '',
      supplement:   r.supplement || '',
      supplementTime: formatDateStr(r.supplement_at),
      ratingReason: r.rating_reason || '',
      designerReply:r.designer_reply || '',
      designHistory:r.design_history || ''
    };
  });

  window.__allMatches = matches;
  applyStatusFilterAndRender();
}

function applyStatusFilterAndRender(){
  const results = document.getElementById('results');
  const allMatches = window.__allMatches || [];
  if(allMatches.length === 0) return;

  const sortMode = document.getElementById('sortFilter').value;
  const statusFilter = document.getElementById('statusFilter').value;
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

  let matches = allMatches.slice();
  if(statusFilter !== 'all'){
    matches = matches.filter(function(m){ return (m.status || '待處理').trim() === statusFilter; });
  }
  if(searchTerm){
    matches = matches.filter(function(m){
      return (m.reqName || '').toLowerCase().indexOf(searchTerm) !== -1 ||
        (m.brand || '').toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  if(sortMode === 'dueAsc' || sortMode === 'dueDesc'){
    matches.sort(function(a,b){
      const da = parseListDate(a.dueDate), db = parseListDate(b.dueDate);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return sortMode === 'dueAsc' ? da - db : db - da;
    });
  }else if(sortMode === 'fillDesc' || sortMode === 'fillAsc'){
    matches.sort(function(a,b){
      const da = parseListDate(a.fillDate), db = parseListDate(b.fillDate);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return sortMode === 'fillAsc' ? da - db : db - da;
    });
  }

  window.__lastMatches = matches;

  if(matches.length === 0){
    results.innerHTML = '<div class="state-msg">沒有符合篩選條件的案件。</div>';
    return;
  }

  const urgentMatches = matches.filter(function(m){ return m.isUrgent === 'Y'; });
  const normalMatches = matches.filter(function(m){ return m.isUrgent !== 'Y'; });

  let html = '';
  if(urgentMatches.length > 0){
    html += '<div class="urgent-block">' +
      '<div class="urgent-block-head">🔴 急件（' + urgentMatches.length + '）</div>' +
      urgentMatches.map(renderReqCard).join('') +
    '</div>';
  }
  html += normalMatches.map(renderReqCard).join('');

  results.innerHTML = html;
  scrollToDeepLinkedReqCase();
}

function scrollToDeepLinkedReqCase(){
  if(__reqDeepLinkHandled) return;
  const params = new URLSearchParams(window.location.search);
  const caseId = (params.get('case') || '').trim();
  if(!caseId) return;

  let attempts = 0;
  const maxAttempts = 10;
  const tryFind = function(){
    const el = document.getElementById('req-card-' + caseId);
    if(el){
      __reqDeepLinkHandled = true;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('deep-link-highlight');
      setTimeout(function(){ el.classList.remove('deep-link-highlight'); }, 2600);
      return;
    }
    attempts++;
    if(attempts < maxAttempts) setTimeout(tryFind, 300);
  };
  setTimeout(tryFind, 150);
}

function buildStarPicker(crit){
  const wrap = document.querySelector('.star-picker[data-crit="' + crit + '"]');
  const groupName = 'rating-' + crit;
  let html = '';
  for(let i=5;i>=1;i--){
    const inputId = groupName + '-' + i;
    const checked = (i === currentRating[crit]) ? ' checked' : '';
    html += '<input id="' + inputId + '" type="radio" name="' + groupName + '" value="' + i + '"' + checked +
      ' onchange="setStar(\'' + crit + '\',' + i + ')">' +
      '<label for="' + inputId + '" title="' + i + ' 顆星">' +
        '<svg viewBox="0 0 576 512" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="' + STAR_PATH + '"></path></svg>' +
      '</label>';
  }
  wrap.innerHTML = html;
}

function setStar(crit, v){
  currentRating[crit] = v;
  checkReasonNeeded();
  updateScoreBadge();
}

function updateScoreBadge(){
  const vals = Object.keys(currentRating).map(function(k){ return currentRating[k]; }).filter(function(v){ return v > 0; });
  const badge = document.getElementById('rateScoreBadge');
  if(vals.length === 0){
    badge.textContent = '0 分';
    return;
  }
  const avgStars = vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
  const score = Math.round(avgStars * 20);
  badge.textContent = score + ' 分';
}

function checkReasonNeeded(){
  const needsReason = Object.keys(currentRating).some(function(k){ return currentRating[k] > 0 && currentRating[k] <= 2; });
  document.getElementById('reasonBlock').classList.toggle('show', needsReason);
  return needsReason;
}

let dateCounts = {};

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function toDateStr(y,m,d){ return y + '-' + pad2(m+1) + '-' + pad2(d); }
function normalizeDateStr(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return null;
  return m[1] + '-' + pad2(parseInt(m[2],10)) + '-' + pad2(parseInt(m[3],10));
}

function copyCurrentHandler(){
  const group = copyOriginalData.group;
  const designers = group ? GROUP_DESIGNERS[group] : [];
  return designers.length > 1
    ? document.getElementById('copyDesigner').value
    : (designers[0] || copyOriginalData.handler || '');
}

// 清洗 Supabase 回傳的日期值：有些舊資料匯入時被存成完整 JS 時間戳字串
// （例如 "Tue Aug 17 2026 00:00:00 GMT+0800..."），先轉成乾淨的 yyyy-MM-dd 再比對
function cleanDueDate(val){
  if(!val) return null;
  const direct = normalizeDateStr(val);
  if(direct) return direct;
  const d = new Date(val);
  if(isNaN(d.getTime())) return null;
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function loadCopyDateCounts(){
  loadAllTabRows().then(function(rows){
    try{
      const counts = {};
      rows.forEach(function(r){
        const due = cleanDueDate(r.due_date || '');
        const handler = (r.handler || '').trim();
        const status = r.status || '';
        if(!due || !handler || status === '退件') return;
        if(!counts[handler]) counts[handler] = {};
        counts[handler][due] = (counts[handler][due] || 0) + 1;
      });
      dateCounts = counts;
    }catch(err){ /* 讀取失敗就不擋日期 */ }
    renderCopyCalendar();
  });

  fetch(sbUrl('locked_dates','select=handler,date,reason'),{headers:SUPABASE_HEADERS})
  .then(function(res){ return res.ok ? res.json() : []; })
  .then(function(rows){
    const lockMap = {};
    rows.forEach(function(r){
      if(!r.handler||!r.date) return;
      if(!lockMap[r.handler]) lockMap[r.handler]={};
      lockMap[r.handler][r.date] = r.reason||'';
    });
    window.__copyLockedByDesigner = lockMap;
    renderCopyCalendar();
  })
  .catch(function(){ window.__copyLockedByDesigner={}; renderCopyCalendar(); });
}

function copyIsDateBlocked(dateStr){
  const handler = copyCurrentHandler();
  const lockMap = window.__copyLockedByDesigner || {};
  if(handler && lockMap[handler] && lockMap[handler].hasOwnProperty(dateStr)){
    return true;
  }
  const isUrgent = document.getElementById('copyUrgent').checked;
  if(isUrgent) return false;
  const g = dateCounts[handler] || {};
  return (g[dateStr] || 0) >= DAILY_LIMIT;
}

function copyLockedReasonFor(dateStr){
  const handler = copyCurrentHandler();
  const lockMap = window.__copyLockedByDesigner || {};
  if(handler && lockMap[handler] && lockMap[handler].hasOwnProperty(dateStr)){
    return lockMap[handler][dateStr] || '';
  }
  return null;
}

function renderCopyCalendar(){
  const y = copyCalendarDate.getFullYear();
  const m = copyCalendarDate.getMonth();
  document.getElementById('copyCalMonthLabel').textContent = y + ' 年 ' + (m+1) + ' 月';

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const now = new Date();
  const todayStr = toDateStr(now.getFullYear(), now.getMonth(), now.getDate());
  const selected = document.getElementById('copyDueDate').value;
  const handlerNow = copyCurrentHandler();

  let html = '';
  for(let i=0;i<firstDay;i++){ html += '<div class="cal-day empty"></div>'; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = toDateStr(y, m, d);
    const lockReason = copyLockedReasonFor(dateStr);
    const isLocked = lockReason !== null;
    const blocked = copyIsDateBlocked(dateStr);
    const count = (dateCounts[handlerNow] && dateCounts[handlerNow][dateStr]) || 0;
    let cls = 'cal-day';
    if(blocked) cls += ' blocked';
    if(isLocked) cls += ' manually-locked';
    if(dateStr === todayStr) cls += ' today';
    if(dateStr === selected) cls += ' selected';
    const titleAttr = isLocked ? ' title="設計師已封鎖此日期' + (lockReason ? '：' + lockReason : '') + '"' : '';
    html += '<div class="' + cls + '"' + titleAttr + ' onclick="' + (blocked ? '' : ("selectCopyDate('" + dateStr + "')")) + '">' +
      '<span class="cal-day-num">' + d + '</span>' +
      '<span class="cal-day-count">' + count + '</span>' +
    '</div>';
  }
  document.getElementById('copyCalGrid').innerHTML = html;
}

function submitCopiedCase(){
  const reqName = document.getElementById('copyReqName').value.trim();
  const reqPerson = document.getElementById('copyReqPerson').value.trim();
  const dueDate = document.getElementById('copyDueDate').value;
  const brand = document.getElementById('copyBrand').value;
  const reqType = document.getElementById('copyReqType').value;
  const caseType = document.getElementById('copyCaseType').value;
  const msg = document.getElementById('copyModalMsg');

  if(!reqName || !reqPerson || !dueDate || !brand || !reqType || !caseType){
    msg.textContent = '請完整填寫品牌、設計類型、案件類型、需求名稱、需求人員、需求日期';
    msg.className = 'modal-msg error';
    return;
  }
  if(copyIsDateBlocked(dueDate)){
    msg.textContent = '這天已經額滿或被設計師封鎖，請改選其他日期';
    msg.className = 'modal-msg error';
    return;
  }

  const group = copyOriginalData.group;
  const designers = group ? GROUP_DESIGNERS[group] : [];
  let handler = designers[0] || copyOriginalData.handler || '';
  if(designers.length > 1){
    handler = document.getElementById('copyDesigner').value;
  }

  const today = new Date();
  const fillDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const isUrgent = document.getElementById('copyUrgent').checked;

  const payload = {
    group: group || '',
    handler: handler,
    brand: brand,
    reqType: reqType,
    caseType: caseType,
    reqName: reqName,
    reqPerson: reqPerson,
    fillDate: fillDate,
    dueDate: dueDate,
    materials: document.getElementById('copyMaterials').value,
    caseFields: document.getElementById('copyCaseFields').value,
    channel: document.getElementById('copyChannel').value,
    notes: document.getElementById('copyNotes').value,
    isUrgent: isUrgent ? 'Y' : '',
    urgentReasonCat: isUrgent ? '延續先前案件（複製新增）' : '',
    urgentReasonOther: ''
  };

  const btn = document.getElementById('copySubmitBtn');
  btn.disabled = true;
  msg.textContent = '送出中...';
  msg.className = 'modal-msg';

  const sbBody = {
    action:             'submitNewCase',
    brand:              payload.brand,
    req_type:           payload.reqType,
    req_name:           payload.reqName,
    req_person:         payload.reqPerson,
    fill_date:          payload.fillDate,
    due_date:           payload.dueDate,
    materials:          payload.materials,
    case_fields:        payload.caseFields,
    channel:            payload.channel,
    notes:              payload.notes,
    handler:            payload.handler,
    group_name:         payload.group,
    case_type:          payload.caseType,
    is_urgent:          payload.isUrgent||'N',
    urgent_reason_cat:  payload.urgentReasonCat||'',
    urgent_reason_other:payload.urgentReasonOther||'',
    is_rejection_fix:   !!(copyOriginalData && copyOriginalData.isFix)
  };

  fetch(PUBLIC_ACTION_URL,{
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(sbBody)
  })
  .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
  .then(function(result){
    btn.disabled = false;
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    msg.textContent = '✓ 已送出新需求';
    msg.className = 'modal-msg success';
    setTimeout(function(){ closeCopyModal(); }, 1000);
  })
  .catch(function(err){
    btn.disabled = false;
    msg.textContent = '送出失敗：'+(err&&err.message?err.message:'未知錯誤');
    msg.className = 'modal-msg error';
  });
}

// ---- 修改需求日期 ----
let currentEditDateId = null;
let currentEditHandler = null;
let editCalendarDate = new Date();

function openEditDateModal(data){
  currentEditDateId = data.id;
  currentEditHandler = data.handler;
  document.getElementById('editDateModalReqName').textContent = data.reqName || '';
  document.getElementById('editDateCurrent').textContent = data.dueDate || '（未填寫）';
  document.getElementById('editDueDate').value = '';
  document.getElementById('editDueDateDisplay').value = '';
  document.getElementById('editDateModalMsg').textContent = '';
  document.getElementById('editDateModalMsg').className = 'modal-msg';
  editCalendarDate = new Date();
  document.getElementById('editDateModalOverlay').classList.add('show');
  renderEditCalendar();
  loadEditDateCounts();
}

function closeEditDateModal(){
  document.getElementById('editDateModalOverlay').classList.remove('show');
  document.getElementById('editCalendarPopup').classList.remove('show');
  currentEditDateId = null;
  currentEditHandler = null;
}

let editDateCounts = {};
let editLockedDates = {};

function loadEditDateCounts(){
  loadAllTabRows().then(function(rows){
    try{
      const counts = {};
      rows.forEach(function(r){
        const due = formatDateStr(r.due_date);
        const handler = r.handler || '';
        const status = r.status || '';
        if(!due || status === '退件') return;
        if(!counts[handler]) counts[handler] = {};
        counts[handler][due] = (counts[handler][due] || 0) + 1;
      });
      editDateCounts = counts;
    }catch(err){ editDateCounts = {}; }
    renderEditCalendar();
  });

  fetch(sbUrl('locked_dates','select=handler,date,reason'),{headers:SUPABASE_HEADERS})
  .then(function(res){ return res.ok ? res.json() : []; })
  .then(function(rows){
    const lockMap = {};
    rows.forEach(function(r){
      if(!r.handler||!r.date) return;
      if(!lockMap[r.handler]) lockMap[r.handler] = {};
      lockMap[r.handler][r.date] = r.reason || '';
    });
    editLockedDates = lockMap;
    renderEditCalendar();
  })
  .catch(function(){ editLockedDates = {}; renderEditCalendar(); });
}

function editIsDateBlocked(dateStr){
  const lockMap = editLockedDates[currentEditHandler] || {};
  if(lockMap.hasOwnProperty(dateStr)) return true;
  const counts = (editDateCounts[currentEditHandler] || {});
  return (counts[dateStr] || 0) >= DAILY_LIMIT;
}

function editLockedReasonFor(dateStr){
  const lockMap = editLockedDates[currentEditHandler] || {};
  return lockMap.hasOwnProperty(dateStr) ? (lockMap[dateStr] || '') : null;
}

function toggleEditCalendar(){
  const popup = document.getElementById('editCalendarPopup');

function changeEditCalMonth(delta){

  const now = new Date();
  const todayStr = toDateStr(now.getFullYear(), now.getMonth(), now.getDate());
  const selected = document.getElementById('editDueDate').value;

  let html = '';
  for(let i=0; i<firstDay; i++){ html += '<div class="cal-day empty"></div>'; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = toDateStr(y, m, d);
    const lockReason = editLockedReasonFor(dateStr);
    const isLocked = lockReason !== null;
    const blocked = editIsDateBlocked(dateStr);
    const count = (editDateCounts[currentEditHandler] && editDateCounts[currentEditHandler][dateStr]) || 0;
    let cls = 'cal-day';
    if(blocked) cls += ' blocked';
    if(isLocked) cls += ' manually-locked';
    if(dateStr === todayStr) cls += ' today';
    if(dateStr === selected) cls += ' selected';
    const titleAttr = isLocked ? ' title="設計師已封鎖此日期' + (lockReason ? '：' + lockReason : '') + '"' : '';
    html += '<div class="' + cls + '"' + titleAttr + ' onclick="' + (blocked ? '' : ("selectEditDate('" + dateStr + "')")) + '">' +
      '<span class="cal-day-num">' + d + '</span>' +

function submitRating(){
  if(!currentRating.quality || !currentRating.efficiency || !currentRating.communication || !currentRating.price){
    const msg = document.getElementById('rateModalMsg');
    msg.textContent = '請完成四項評分後再送出。';
    msg.className = 'modal-msg error';
    return;
  }
  const reasonText = document.getElementById('reasonText').value.trim();
  if(checkReasonNeeded() && !reasonText){
    const msg = document.getElementById('rateModalMsg');
    msg.textContent = '有項目評為 2 顆星以下，請說明原因後再送出。';
    msg.className = 'modal-msg error';
    return;
  }
  const btn = document.getElementById('rateSubmitBtn');
  const btnText = document.getElementById('rateSubmitBtnText');
  btn.disabled = true;
  btnText.textContent = '送出中...';

  fetch(PUBLIC_ACTION_URL,{
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({
      action:'submitRating',
      id: currentRatingId,
      rating_quality:       currentRating.quality,
      rating_efficiency:    currentRating.efficiency,
      rating_communication: currentRating.communication,
      rating_price:         currentRating.price,
      rating_reason:        reasonText
    })
  })
  .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
  .then(function(result){
    const msg = document.getElementById('rateModalMsg');
    if(!result.ok || result.data.status !== 'success') throw new Error(result.data.message || 'HTTP 錯誤');
    msg.textContent = '';
    btnText.textContent = '確認結案';
    btn.classList.add('success-state');
    setTimeout(function(){
      btn.classList.remove('success-state');
      btn.disabled = false;
      closeRateModal();
      doSearch();
    }, 1400);
  })
  .catch(function(err){
    const msg = document.getElementById('rateModalMsg');
    msg.textContent = '送出失敗：'+(err&&err.message?err.message:'未知錯誤');
    msg.className = 'modal-msg error';
    btnText.textContent = '確認結案';
    btn.disabled = false;
  });
}
